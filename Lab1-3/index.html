<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор резюме - Лабораторна робота 1-3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Конструктор Професійного Резюме</h1>
            <p>Лабораторна робота з JavaScript (ООП, Замикання, DOM)</p>
        </header>

        <main class="main-content">
            <section class="form-section">
                <h2>1. Заповніть інформацію</h2>
                <form id="resumeForm">
                    <fieldset>
                        <legend>Особисті дані</legend>
                        <div class="form-group">
                            <label for="fullName">Повне ім'я:</label>
                            <input type="text" id="fullName" required placeholder="Іван Іванов">
                        </div>
                        <div class="form-group">
                            <label for="userAge">Вік:</label>
                            <input type="text" id="userAge" required placeholder="25">
                        </div>
                        <div class="form-group">
                            <label for="userEmail">Email:</label>
                            <input type="email" id="userEmail" required placeholder="ivan@example.com">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Освіта</legend>
                        <div class="form-group">
                            <label for="eduInst">Навчальний заклад:</label>
                            <input type="text" id="eduInst" required placeholder="ДУІКТ">
                        </div>
                        <div class="form-group">
                            <label for="eduSpec">Спеціальність:</label>
                            <input type="text" id="eduSpec" required placeholder="Комп'ютерна інженерія">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Досвід роботи</legend>
                        <div class="form-group">
                            <label for="expCompany">Компанія:</label>
                            <input type="text" id="expCompany" placeholder="Tech Solutions">
                        </div>
                        <div class="form-group">
                            <label for="expRole">Посада:</label>
                            <input type="text" id="expRole" placeholder="Frontend Developer">
                        </div>
                        <div class="form-group">
                            <label for="expYears">Років досвіду:</label>
                            <input type="text" id="expYears" placeholder="2">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Професійні навички</legend>
                        <div class="form-group">
                            <label for="skillsList">Навички (через кому):</label>
                            <input type="text" id="skillsList" placeholder="JavaScript, HTML5, CSS3, Git">
                        </div>
                    </fieldset>

                    <div class="form-actions">
                        <button type="submit" id="btnGenerate">Згенерувати резюме</button>
                        <button type="button" id="btnClearStorage">Очистити збережене</button>
                    </div>
                </form>
            </section>

            <section class="preview-section">
                <h2>2. Попередній перегляд</h2>
                <div id="resumePreview" class="resume-sheet">
                    <p class="placeholder-text">Заповніть форму ліворуч для генерації резюме...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
